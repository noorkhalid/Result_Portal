{% extends "dashboards/_layout.html" %}
{% block title %}Sessions{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="mb-0">Sessions</h3>
  <a href="{% url 'admin_session_add' %}" class="btn btn-primary btn-icon-only" title="Add Session" aria-label="Add Session"><i class="bi bi-plus-circle"></i></a>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-striped align-middle mb-0">
      <thead>
        <tr>
          <th>Start Year</th>
          <th>Status</th>
          <th style="width: 160px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for s in sessions %}
        <tr>
          <td>{{ s.start_year }}</td>
          <td>
            {% if s.is_active %}<span class="badge bg-success">Active</span>
            {% else %}<span class="badge bg-secondary">Inactive</span>{% endif %}
          </td>
          <td>
            <a href="{% url 'admin_session_edit' s.id %}" class="btn btn-sm btn-warning btn-icon-only" title="Edit" aria-label="Edit"><i class="bi bi-pencil-square"></i></a>
            <a href="{% url 'admin_session_delete' s.id %}" class="btn btn-sm btn-danger btn-icon-only" title="Delete" aria-label="Delete"><i class="bi bi-trash"></i></a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted py-4">No sessions found</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
