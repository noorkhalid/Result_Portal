{% extends "dashboards/_layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 720px;">
  <h4 class="mb-3">{{ title }}</h4>

  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Start Year</label>
      {{ form.start_year }}
      {% if form.start_year.errors %}<div class="text-danger small">{{ form.start_year.errors }}</div>{% endif %}
    </div>

    <div class="form-check mb-3">
      {{ form.is_active }}
      <label class="form-check-label">Active</label>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-icon-only" title="Save" aria-label="Save"><i class="bi bi-floppy"></i></button>
      <a href="{% url 'admin_session_list' %}" class="btn btn-outline-secondary btn-icon-only" title="Cancel" aria-label="Cancel"><i class="bi bi-x-lg"></i></a>
    </div>
  </form>
</div>
{% endblock %}
