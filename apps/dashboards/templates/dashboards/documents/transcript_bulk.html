<!DOCTYPE html>
<html>
<head>
    <title>Bulk Transcript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .student-block {
            margin-bottom: 40px;
        }

        h3 {
            margin-bottom: 5px;
        }

        hr {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        @media print {
            .page-break {
                page-break-after: always;
            }
        }
    </style>
</head>

<body>

{% for enrollment in enrollments %}

<div class="student-block">

    <h3>{{ enrollment.student.name }}</h3>

    <p><strong>Registration No:</strong> {{ enrollment.student.registration_no }}</p>

    <!-- Placeholder for future transcript layout -->
    <p><em>Transcript content will be rendered here...</em></p>

    <hr>

</div>

<div class="page-break"></div>

{% endfor %}

</body>
</html>
