{% extends "dashboards/_layout.html" %}
{% block title %}Delete Offering{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 820px;">
  <h4 class="mb-2">Delete Program Offering</h4>
  <p class="text-muted mb-3">Are you sure you want to delete this offering?</p>

  <div class="alert alert-warning">
    <strong>{{ item.department.name }}</strong> → <strong>{{ item.program.name }}</strong>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button class="btn btn-danger btn-icon-only" title="Delete" aria-label="Delete"><i class="bi bi-trash"></i></button>
      <a href="{% url 'admin_program_offering_list' %}" class="btn btn-outline-secondary btn-icon-only" title="Cancel" aria-label="Cancel"><i class="bi bi-x-lg"></i></a>
    </div>
  </form>
</div>
{% endblock %}
