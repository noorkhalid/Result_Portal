{% extends "dashboards/_layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 920px;">
  <h4 class="mb-3">{{ title }}</h4>
  <form method="post">
    {% csrf_token %}

    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">Department</label>
        {{ form.department }}
      </div>
      <div class="col-md-12">
        <label class="form-label">Program</label>
        {{ form.program }}
      </div>
      <div class="col-md-12">
        <div class="form-check mt-2">
          {{ form.is_active }}
          <label class="form-check-label">Active</label>
        </div>
      </div>
    </div>

    {% if form.non_field_errors %}
      <div class="alert alert-danger mt-3">{{ form.non_field_errors }}</div>
    {% endif %}

    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-primary btn-icon-only" title="Save" aria-label="Save"><i class="bi bi-floppy"></i></button>
      <a href="{% url 'admin_program_offering_list' %}" class="btn btn-outline-secondary btn-icon-only" title="Cancel" aria-label="Cancel"><i class="bi bi-x-lg"></i></a>
    </div>
  </form>
</div>
{% endblock %}
