{% load static %}
{% load results_extras %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Styles are intentionally kept in-sync with results/transcript.html */
    @page { size: A4 portrait; margin: 10mm 12mm; }
    *{ box-sizing: border-box; }

    body{
      font-family: "Times New Roman", serif;
      font-size: 11.5px;
      color:#000;
      margin:0;
    }

    .page{ width:100%; }

    .hdr{ width:100%; display: table; table-layout: fixed; margin-top: 2mm; margin-bottom: 3mm; }
    .hdr .cell{ display: table-cell; vertical-align: middle; }
    .hdr .cell.logo{ width: 22mm; }
    .hdr .cell.logo img{ width: 18mm; height: auto; display:block; }
    .hdr .cell.title{ text-align: center; }
    .u-name{ font-weight: 700; font-size: 15.5px; letter-spacing: .2px; }
    .u-sub{ font-weight: 700; font-size: 12.5px; margin-top: 1mm; }
    .u-doc{ font-weight: 700; font-size: 12.5px; margin-top: 1mm; }

    .info{ width:100%; display: table; table-layout: fixed; margin: 2mm 0 2mm; font-size: 11.5px; }
    .info .row{ display: table-row; }
    .info .cell{ display: table-cell; padding: 0.6mm 0; vertical-align: top; }
    .lbl{ font-weight: 700; width: 22mm; }
    .val{ width: 63mm; }
    .lbl-r{ font-weight: 700; width: 28mm; padding-left: 6mm; }
    .val-r{ width: 50mm; }

    .sem-title{ font-weight: 700; margin-top: 2.5mm; }

    table.marks{ width:100%; border-collapse: collapse; margin-top: 1mm; table-layout: fixed; }
    table.marks th, table.marks td{ border: 1px solid #000; padding: 1.2mm 1.4mm; vertical-align: middle; }
    table.marks th{ font-weight: 700; text-align: center; }
    table.marks td{ text-align: center; }
    table.marks td.subj{ text-align: left; }

    .sem-foot{ width:100%; display: table; table-layout: fixed; margin-top: 0.8mm; font-size: 11.5px; }
    .sem-foot .cell{ display: table-cell; vertical-align: top; }
    .sem-foot .left{ width: 45%; }
    .sem-foot .right{ width: 55%; text-align: right; }
    .sem-foot b{ font-weight:700; }
    .sem-foot .right span{ display: inline-block; min-width: 26mm; text-align: left; }

    .bottom{ width:100%; display: table; table-layout: fixed; margin-top: 4mm; }
    .bottom .cell{ display: table-cell; vertical-align: bottom; }
    .bottom .left{ width: 58%; }
    .bottom .right{ width: 42%; text-align: center; font-weight:700; }

    table.footer-box{ width: 95%; border-collapse: collapse; font-size: 11.5px; }
    table.footer-box td{ border: 1px solid #000; padding: 1.1mm 1.4mm; }
    table.footer-box td:first-child{ width: 60%; font-weight: 700; }
    table.footer-box td:last-child{ width: 40%; text-align: right; font-weight: 700; }

    .errors{ font-style: italic; margin-top: 1mm; font-size: 10.5px; }
    .avoid-break{ page-break-inside: avoid; }

    /* Double-column layout (>3 semesters): KEEP EXACTLY in-sync with results/transcript.html */
    body.double{
      font-size: 10.5px; /* slightly smaller to keep everything on one page */
    }

    table.pair-table{
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-top: 1.5mm;
      page-break-inside: avoid;
      border: 2px solid #000; /* strong outer border like sample */
    }
    table.pair-table th, table.pair-table td{
      border: 0;
      padding: 0.9mm 1.0mm;
      font-size: 10.2px;
      vertical-align: middle;
    }
    table.pair-table th{
      font-weight: 700;
      text-align: center;
    }
    /* show column headings only once (top) */
    table.pair-table thead tr.col-head th{
      border-bottom: 1px solid #000;
    }
    /* semester heading row separator */
    table.pair-table thead tr.semhead-row th{
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* keep only the middle divider like sample */
    table.pair-table .mid{
      border-left: 2px solid #000 !important;
    }
    /* summary separators */
    table.pair-table tr.summary-top td{
      border-top: 2px solid #000;
    }
    table.pair-table td{ text-align: center; }
    table.pair-table td.title{ text-align: left; }
    .mid{ border-left-width: 2px !important; }
    /* keep clean like sample (no extra thick internal lines) */
    .pair-top{ margin-top: 2mm; }
    .pair-bottom{ border-bottom-width: 2px !important; }
    .semhead{
      font-weight: 700;
      text-align: center;
      background: #fff;
    }

    /* Summary rows inside paired semester blocks (match sample look) */
    tr.summary-top td{ border-top: 2px solid #000; }

    /* Bottom row in double layout: last semester on left, footer box on right */
    .double-bottom-row{
      width: 100%;
      display: table;
      table-layout: fixed;
      margin-top: 1.5mm;
    }
    .double-bottom-row .cell{ display: table-cell; vertical-align: top; }
    .double-bottom-row .left{ width: 50%; padding-right: 2.5mm; }
    .double-bottom-row .right{ width: 50%; padding-left: 2.5mm; }

    table.single-sem{
      width: 100%;
      border: 2px solid #000;
      border-collapse: collapse;
      table-layout: fixed;
      page-break-inside: avoid;
    }
    table.single-sem th, table.single-sem td{
      border: 0;
      padding: 0.9mm 1.0mm;
      font-size: 10.2px;
    }
    table.single-sem th{ font-weight:700; text-align:center; }
    table.single-sem thead tr.semhead-row th{
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    table.single-sem tr.summary-top td{ border-top: 2px solid #000; }
    table.single-sem td{ text-align:center; }
    table.single-sem td.title{ text-align:left; }

    .controller{
      width: 100%;
      margin-top: 3mm;
      text-align: right;
      font-weight: 700;
      font-size: 11px;
    }

    /* Tighten bottom spacing in double layout to keep single page */
    .bottom.double{ margin-top: 0; }

    /* Batch: explicit page breaks between transcripts */
    .page-break{ page-break-after: always; }
  </style>
</head>

<body class="{% if layout_mode == 'double' %}double{% endif %}">

  {{ rendered_html|safe }}

</body>
</html>
