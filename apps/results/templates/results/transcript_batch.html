{% load static %}
{% load results_extras %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Styles are intentionally kept in-sync with results/transcript.html */
    @page { size: A4 portrait; margin: 8mm 10mm; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #000;
      font-family: "Times New Roman", serif;
      font-size: 10px;
      line-height: 1.15;
    }

    .page { width: 100%; }

    .hdr {
      width: 100%;
      display: table;
      table-layout: fixed;
      margin: 10mm 0 2mm;
    }
    .hdr .cell { display: table-cell; vertical-align: middle; }
    .hdr .logo { width: 18mm; }
    .hdr .logo img { width: 15mm; display: block; }
    .hdr .title { text-align: center; }
    .u-name { font-weight: 700; font-size: 14px; }
    .u-doc { font-weight: 700; font-size: 11px; margin-top: 0.8mm; }

    .info {
      width: 100%;
      display: table;
      table-layout: fixed;
      margin: 10mm 0 2mm;
      font-size: 9.6px;
    }
    .info .row { display: table-row; }
    .info .cell { display: table-cell; padding: 0.35mm 0; vertical-align: top; }
    .lbl, .lbl-r { font-weight: 700; }
    .lbl { width: 16mm; }
    .val { width: 57mm; }
    .lbl-r { width: 24mm; padding-left: 4mm; }
    .val-r { width: 44mm; }

    table.pair-table,
    table.single-sem,
    table.footer-summary {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      page-break-inside: avoid;
    }

    table.pair-table {
      margin-top: 1.4mm;
      margin-bottom: 2.2mm;
      border: 1.7px solid #000;
    }

    table.pair-table th,
    table.pair-table td,
    table.single-sem th,
    table.single-sem td {
      padding: 0.6mm 0.7mm;
      font-size: 9px;
      vertical-align: middle;
      border: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    table.pair-table th,
    table.single-sem th {
      font-weight: 700;
      text-align: center;
    }

    table.pair-table td,
    table.single-sem td {
      text-align: center;
    }

    table.pair-table td.title,
    table.single-sem td.title {
      text-align: left;
      word-wrap: break-word;
    }

    table.pair-table thead tr.col-head th {
      border-bottom: 1px solid #000;
    }

    table.pair-table thead tr.semhead-row th,
    table.single-sem thead tr.semhead-row th {
      border-bottom: 1px solid #000;
      font-size: 10px;
      padding-top: 0.8mm;
      padding-bottom: 0.8mm;
    }

    table.pair-table .mid {
      border-left: 2.4px solid #000 !important;
    }

    table.pair-table tr.summary-top td,
    table.single-sem tr.summary-top td {
      border-top: 1.3px solid #000;
    }

    .pair-bottom td,
    .pair-bottom th {
      border-top: 0;
    }

    .double-bottom-row {
      width: 100%;
      display: table;
      table-layout: fixed;
      margin-top: 1.4mm;
      page-break-inside: avoid;
    }

    .double-bottom-row .cell { display: table-cell; vertical-align: top; }
    .double-bottom-row .left { width: 50%; padding-right: 2mm; }
    .double-bottom-row .right { width: 50%; }

    table.single-sem {
      border: 1.7px solid #000;
    }

    table.single-sem thead tr.col-head th {
      border-bottom: 1px solid #000;
    }

    table.single-sem tr.single-summary-row td {
      border-top: 1.3px solid #000;
      font-weight: 700;
      padding-top: 0.8mm;
      padding-bottom: 0.8mm;
    }

    .footer-block {
      margin-top: 2.4mm;
      page-break-inside: avoid;
    }

    table.footer-summary {
      font-size: 9.2px;
      border-collapse: collapse;
      border: 2px solid #000;
    }

    table.footer-summary th,
    table.footer-summary td {
      border: 1.3px solid #000;
      padding: 0.8mm 0.7mm;
      text-align: center;
      vertical-align: middle;
    }

    table.footer-summary thead th {
      border-bottom: 1.8px solid #000;
      font-weight: 700;
    }

    table.footer-summary tbody td {
      font-weight: 700;
    }

    .footer-note {
      width: 100%;
      display: table;
      table-layout: fixed;
      margin-top: 2.2mm;
      font-size: 9px;
    }

    .footer-note .cell { display: table-cell; vertical-align: bottom; }
    .errors { font-style: italic; }

    .controller {
      text-align: right;
      font-weight: 700;
      white-space: nowrap;
      font-size: 10.4px;
      line-height: 1.25;
      padding-top: 4.5mm;
    }

    /* Batch: explicit page breaks between transcripts */
    .page-break { page-break-after: always; }

    /* Dynamic spacing for fewer semesters */
    body.few-sems table.pair-table td,
    body.few-sems table.single-sem td {
      padding: 1.8mm 0.7mm;
    }

    body.few-sems table.pair-table tbody tr,
    body.few-sems table.single-sem tbody tr {
      height: 8mm;
    }
  </style>
</head>

<body class="{% if layout_mode == 'double' %}double{% endif %} {% if semester_pairs|length <= 2 %}few-sems{% endif %}">
  {{ rendered_html|safe }}
</body>
</html>
