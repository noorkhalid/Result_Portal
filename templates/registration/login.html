{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Result Portal</title>

    <link href="{% static 'css/css/bootstrap.min.css' %}" rel="stylesheet">

    <style>
      body { background:#f6f7fb; }
      .card { border:0; box-shadow:0 10px 30px rgba(17,24,39,.08); border-radius:16px; }
      .topbar { background:#0f4c5c; color:#fff; }

      /* Show/Hide button styling */
      .pwd-wrap { position: relative; }
      .pwd-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        padding: 4px 6px;
        font-size: 12px;
        font-weight: 600;
        color: #0f4c5c;
        cursor: pointer;
      }
      .pwd-toggle:focus {
        outline: none;
        box-shadow: 0 0 0 .25rem rgba(13,110,253,.25); /* bootstrap-like focus ring */
        border-radius: 8px;
      }
      /* Add space so text doesn't go under the button */
      #id_password { padding-right: 64px; }
    </style>
  </head>

  <body>
    <div class="topbar py-2">
      <div class="container"><strong>Result Portal</strong></div>
    </div>

    <div class="container" style="max-width:480px;">
      <div class="card p-4 mt-5">
        <h4 class="mb-1">Sign in</h4>
        <p class="text-muted">Use your username and password</p>

        {% if form.errors %}
          <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input
              class="form-control"
              type="text"
              name="username"
              autofocus
              autocapitalize="none"
              autocomplete="username"
              maxlength="150"
              required
              id="id_username"
            >
          </div>

          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>

            <div class="pwd-wrap">
              <input
                class="form-control"
                type="password"
                name="password"
                autocomplete="current-password"
                required
                id="id_password"
              >
              <button
                type="button"
                id="togglePassword"
                class="pwd-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>

      </div>
    </div>

    <script src="{% static 'js/js/bootstrap.bundle.min.js' %}"></script>

    <script>
      (function () {
        const pwd = document.getElementById("id_password");
        const btn = document.getElementById("togglePassword");

        if (!pwd || !btn) return;

        btn.addEventListener("click", function () {
          const isHidden = pwd.type === "password";
          pwd.type = isHidden ? "text" : "password";
          btn.textContent = isHidden ? "Hide" : "Show";
          btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
          btn.setAttribute("aria-pressed", isHidden ? "true" : "false");
        });
      })();
    </script>
  </body>
</html>
